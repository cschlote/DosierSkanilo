app-id: org.dosierskanilo.DosierSkanilo
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.ldc
  - org.freedesktop.Sdk.Extension.llvm20
command: dosierskanilo
finish-args:
  - --filesystem=home
modules:
  - name: libzen
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libzen/0.4.41/libzen_0.4.41.tar.xz
        sha256: 933bad3b7ecd29dc6bdc88a83645c83dfd098c15b0b90d6177a37fa1536704e8

  - name: libmediainfo
    subdir: Project/GNU/Library
    config-opts:
      - --enable-shared
      - --disable-static
      - --without-libcurl
      - --without-libmms
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      - '*.a'
    sources:
      - type: archive
        url: https://mediaarea.net/download/source/libmediainfo/26.10/libmediainfo_26.10.tar.xz
        sha256: a806fd36592549a03e810486f415a6858d4d8f14066bfbe97b32a447cd5eb590

  - name: dosierskanilo
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/ldc/bin
      prepend-path: /usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      build-args:
        - --share=network
    build-commands:
      - DC=ldc2 DFLAGS="-O3 -release -boundscheck=off" dub build --compiler=ldc2 --config=cli --build=plain
      - install -Dm755 build/bin/dosierskanilo /app/bin/dosierskanilo
      - install -Dm644 LICENSE.md /app/share/licenses/org.dosierskanilo.DosierSkanilo/LICENSE.md
    sources:
      - type: archive
        url: https://github.com/cschlote/DosierSkanilo/archive/refs/tags/v26.13.0.tar.gz
        sha256: 12aba5bf949724996f4dd98cd087352d733685adb03c7d43c0412f21210a4b33
