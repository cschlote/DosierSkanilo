# Use Alpine as CI base image and install required dependencies via script.
variables:
  # We can pass ENV vars to the pipeline
  VA_TEST: "abc"

default:
  image: "alpine:3.20"
  tags:
    - gitlabdocker
    - ryzen
  before_script:
    - command -v image-info.sh && image-info.sh || true

stages:
  - lint
  - build
  - test
  - deploy
  - release

#-- Do linting on the supplied sources --------------------------------------

lint:
  stage: lint
  allow_failure: false
  before_script:
    - sh ./scripts/install-dependencies.sh lint
  script:
    - ./scripts/lint.sh
  cache:
    key: "DUB-CACHE"
    untracked: true
    paths:
      - .dub/

#-- Build the application ---------------------------------------------------

.build:
  stage: build
  tags:
    - gitlabdocker
  coverage: '/^Total coverage: ([0-9]+(\.[0-9]+)?)%$/'
  before_script:
    - sh ./scripts/install-dependencies.sh build
    - sh ./scripts/install-dependencies.sh runtime
  script:
    - ldc2 --version
    - dub --version
    - ./scripts/build.sh
    - tar -C public -czf public.tar.gz .
    - ls -l public.tar.gz
    - ./scripts/test.sh

build:debian13:
  image: "debian:13-slim"
  extends: .build

build:ubuntu24.04:
  image: "ubuntu:24.04"
  extends: .build

build:alpine:
  image: "alpine:3.23"
  extends: .build
  artifacts:
    expire_in: 1 week
    paths:
      - build/bin/dosierskanilo
      - public.tar.gz
      - "build/coverage/*.lst"

#-- Deploy the application --------------------------------------------------

deploy_staging:
  before_script:
    - sh ./scripts/install-dependencies.sh build
    - sh ./scripts/install-dependencies.sh runtime
  stage: deploy
  script:
    - ./scripts/deploy.sh
  environment:
    name: staging
    url: https://packages.vahanus.net
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "testing"'
      when: always
    - when: manual

deploy_prod:
  before_script:
    - sh ./scripts/install-dependencies.sh build
    - sh ./scripts/install-dependencies.sh runtime
  stage: deploy
  script:
    - echo "Deploy to production server"
  environment:
    name: production
    url: https://packages.vahanus.net
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v+)\d+\.\d+\.\d+$/'
      when: always
    - when: manual

#-- Publish API docs via GitLab Pages ---------------------------------------

pages:
  stage: deploy
  needs:
    - job: build:alpine
      artifacts: true
  script:
    - rm -rf public
    - mkdir -p public
    - tar -xzf public.tar.gz -C public
    - echo "API documentation published to GitLab Pages at ${CI_PAGES_URL}."
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

#-- Publish release assets and create GitLab Release ------------------------

publish_release_assets:
  stage: release
  image: "alpine:3.23"
  needs:
    - job: build:alpine
      artifacts: true
  before_script:
    - apk add --no-cache bash curl tar
  script:
    - PACKAGE_NAME="dosierskanilo"
    - mkdir -p build/release
    - ALPINE_ASSET="dosierskanilo-${CI_COMMIT_TAG}-linux-x86_64-alpine.tar.gz"
    - DOCS_ASSET="dosierskanilo-${CI_COMMIT_TAG}-api-docs.tar.gz"
    - tar -C build/bin -czf "build/release/${ALPINE_ASSET}" dosierskanilo
    - cp public.tar.gz "build/release/${DOCS_ASSET}"
    - ALPINE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${ALPINE_ASSET}"
    - DOCS_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_COMMIT_TAG}/${DOCS_ASSET}"
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "build/release/${ALPINE_ASSET}" "${ALPINE_URL}"'
    - 'curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "build/release/${DOCS_ASSET}" "${DOCS_URL}"'
    - echo "RELEASE_ASSET_ALPINE_URL=${ALPINE_URL}" > build/release/release.env
    - echo "RELEASE_ASSET_DOCS_URL=${DOCS_URL}" >> build/release/release.env
    - echo "RELEASE_ASSET_ALPINE_NAME=${ALPINE_ASSET}" >> build/release/release.env
    - echo "RELEASE_ASSET_DOCS_NAME=${DOCS_ASSET}" >> build/release/release.env
  artifacts:
    expire_in: 1 week
    paths:
      - build/release/
    reports:
      dotenv: build/release/release.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never

create_gitlab_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publish_release_assets
      artifacts: true
  script:
    - echo "Creating GitLab Release for ${CI_COMMIT_TAG}"
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Automated release for $CI_COMMIT_TAG.
    assets:
      links:
        - name: 'Alpine x86_64 package ($RELEASE_ASSET_ALPINE_NAME)'
          url: '$RELEASE_ASSET_ALPINE_URL'
          link_type: package
        - name: 'API docs package ($RELEASE_ASSET_DOCS_NAME)'
          url: '$RELEASE_ASSET_DOCS_URL'
          link_type: package
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: on_success
    - when: never
